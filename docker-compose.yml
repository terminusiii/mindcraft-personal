services:
  minecraft:
    image: itzg/minecraft-server:java21
    ports:
      - "127.0.0.1:25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "${MINECRAFT_TYPE:-PAPER}"
      VERSION: "1.21.8"
      MEMORY: "4G"
      MODE: "survival"
      DIFFICULTY: "easy"
      MAX_PLAYERS: "5"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      EXTRA_ARGS: "--safeMode"
    volumes:
      - ${MINECRAFT_DATA_DIR:-./minecraft-data}:/data
      - ./minecraft-config/bukkit.yml:/data/bukkit.yml:ro
    restart: unless-stopped
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20

  mindcraft:
    build: .
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false, "host": "minecraft", "port": 25565}
    volumes:
      - ./settings.js:/app/settings.js
      - ./keys.json:/app/keys.json
      - ./profiles:/app/profiles
      - ./bots:/app/bots
      - ./data:/app/data
    depends_on:
      minecraft:
        condition: service_healthy
    ports:
      - "3000-3003:3000-3003" # see the view from the camera mounted on your bot head: http://localhost:3000/
      - "8080:8080" # Mindserver port
    extra_hosts:
    - "host.docker.internal:host-gateway"

  viaproxy: #use this service to connect to an unsupported minecraft server versions. more info: ./services/viaproxy/README.md
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true
